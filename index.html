<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>ShadowObfuscate HARD X v2</title>

<style>

*{
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
margin:0;
height:100vh;
background:#050505;
color:#ddd;
display:flex;
justify-content:center;
align-items:center;
}

body:before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(#111 1px,transparent 1px),
linear-gradient(90deg,#111 1px,transparent 1px);
background-size:50px 50px;
opacity:.2;
}

.container{
width:1100px;
position:relative;
}

h1{
font-size:64px;
text-align:center;
margin:0;
color:white;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:35px;
}


.box{

background:#090909;
border:1px solid #222;
border-radius:22px;
overflow:hidden;

box-shadow:
0 0 40px #000;

}


.header{

padding:20px;

display:flex;
justify-content:space-between;

border-bottom:1px solid #222;

}


.badge{

background:#222;
padding:8px 16px;
border-radius:20px;
font-size:12px;

}


.editor{

display:grid;
grid-template-columns:1fr 1fr;

}


.area{

padding:20px;

}


.area:first-child{

border-right:1px solid #222;

}



textarea{

width:100%;
height:340px;

background:#030303;

border:1px solid #222;

border-radius:15px;

padding:15px;

color:#ddd;

font-family:Consolas,monospace;

font-size:14px;

resize:none;

}



.controls{

padding:20px;

border-top:1px solid #222;

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

}



.options{

display:flex;

align-items:center;

gap:15px;

flex-wrap:wrap;

}


label{

font-size:13px;

color:#aaa;

}



input{

accent-color:white;

}


select{

background:#111;

color:white;

border:1px solid #333;

padding:10px;

border-radius:10px;

}



button{

cursor:pointer;

transition:.2s;

}



button:hover{

transform:scale(1.05);

}



.main{

background:white;

color:black;

border:0;

border-radius:30px;

padding:15px 35px;

font-weight:bold;

}



.small{

background:#151515;

color:white;

border:1px solid #333;

border-radius:30px;

padding:12px 25px;

}



.buttons{

display:flex;

gap:10px;

}


.status{

text-align:center;

margin-top:20px;

color:#777;

}


</style>

</head>


<body>


<div class="container">


<h1>
ShadowObfuscate
</h1>


<div class="subtitle">
HARD X v2 • Roblox Lua Protector
</div>



<div class="box">


<div class="header">

<b>
ShadowObfuscate Engine v2
</b>


<div class="badge">
BUILD 2.0
</div>


</div>



<div class="editor">


<div class="area">

<p>INPUT LUA</p>

<textarea id="input"
placeholder='print("Hello, World!")'></textarea>

</div>



<div class="area">

<p>OUTPUT LUA</p>

<textarea id="output"
readonly></textarea>

</div>


</div>



<div class="controls">


<div class="options">


<label>
<input id="strings" type="checkbox" checked>
Strings
</label>


<label>
<input id="rename" type="checkbox" checked>
Rename
</label>


<label>
<input id="constants" type="checkbox" checked>
Constants
</label>


<label>
<input id="junk" type="checkbox" checked>
Protection
</label>



<select id="preset">

<option>Medium</option>

<option>Strong</option>

<option>MAX</option>

</select>


</div>



<div class="buttons">


<button class="small" onclick="copyOutput()">
Copy
</button>


<button class="small" onclick="downloadLua()">
Download
</button>


<button class="main" onclick="runObfuscate()">
Obfuscate
</button>


</div>



</div>



</div>



<div class="status" id="status">
Ready
</div>



</div>


<script>
    const BUILD = () =>
Math.floor(Math.random()*900000+100000);



function randomName(){

    const chars =
    "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let name="_";

    for(let i=0;i<10;i++){

        name += chars[
            Math.floor(Math.random()*chars.length)
        ];

    }

    return name;

}





function encodeString(str){

    let bytes=[];

    for(let i=0;i<str.length;i++){

        bytes.push(
            str.charCodeAt(i)
        );

    }


    return `(function()
local t={${bytes.join(",")}}
local r=""
for i=1,#t do
r=r..string.char(t[i])
end
return r
end)()`;

}





function protectStrings(code){

    return code.replace(
        /"([^"\n]*)"/g,

        (_,value)=>{

            return encodeString(value);

        }

    );

}





function renameVariables(code){

    let map={};


    let regex=
    /\blocal\s+([a-zA-Z_][a-zA-Z0-9_]*)/g;


    let match;


    while(
        (match=regex.exec(code))
    ){

        let old=match[1];


        if(!map[old]){

            map[old]=randomName();

        }

    }



    for(let old in map){

        let replacement=map[old];


        code =
        code.replace(
            new RegExp(
                "\\b"+
                old+
                "\\b",
                "g"
            ),
            replacement
        );

    }


    return code;

}





function protectNumbers(code){

    return code.replace(

        /\b\d+\b/g,

        n=>{

            let a=
            Math.floor(
                Math.random()*50
            );


            return "("+
            n+
            "+"+
            a+
            "-"+
            a+
            ")";

        }

    );

}





function generateProtection(level){


    let amount=0;


    if(level=="Medium")
        amount=5;


    if(level=="Strong")
        amount=20;


    if(level=="MAX")
        amount=40;



    let out="";



    for(let i=0;i<amount;i++){


        let a=randomName();


        out +=
`
local ${a}=${Math.floor(Math.random()*999999)}
`;

    }



    return out;

}





function cleanLua(code){

    code =
    code.replace(
        /--.*$/gm,
        ""
    );


    return code.trim();

}





function runObfuscate(){


    let code =
    document
    .getElementById("input")
    .value;



    if(!code.trim()){

        alert(
        "Insert Lua code first"
        );

        return;

    }



    let preset =
    document
    .getElementById("preset")
    .value;



    let build=BUILD();



    code=cleanLua(code);




    if(
    document
    .getElementById("rename")
    .checked
    ){

        code=renameVariables(code);

    }





    if(
    document
    .getElementById("strings")
    .checked
    ){

        code=protectStrings(code);

    }





    if(
    document
    .getElementById("constants")
    .checked
    ){

        code=protectNumbers(code);

    }





    if(
    document
    .getElementById("junk")
    .checked
    ){

        code =
        generateProtection(preset)
        +
        "\n\n"
        +
        code;

    }





    let result =

`-- ShadowObfuscate HARD X v2
-- Build: ${build}
-- Mode: ${preset}


(function()

${code}


end)()
`;




    document
    .getElementById("output")
    .value=result;



    document
    .getElementById("status")
    .innerHTML=

    "Protected ✓ BUILD "+build;



}
    function copyOutput(){

    let output =
    document
    .getElementById("output");


    if(!output.value){

        alert(
        "Nothing to copy"
        );

        return;

    }



    navigator.clipboard.writeText(
        output.value
    )
    .then(()=>{

        document
        .getElementById("status")
        .innerHTML=
        "Copied ✓";

    })
    .catch(()=>{

        output.select();

        document.execCommand("copy");


        document
        .getElementById("status")
        .innerHTML=
        "Copied ✓";

    });

}





function downloadLua(){

    let text =
    document
    .getElementById("output")
    .value;



    if(!text){

        alert(
        "Nothing to download"
        );

        return;

    }



    let blob =
    new Blob(
        [text],
        {
            type:"text/plain"
        }
    );



    let url =
    URL.createObjectURL(blob);



    let a =
    document.createElement("a");



    a.href=url;


    a.download=
    "ShadowProtected.lua";



    document.body.appendChild(a);


    a.click();


    document.body.removeChild(a);



    URL.revokeObjectURL(url);



    document
    .getElementById("status")
    .innerHTML=
    "Downloaded ✓";

}





console.log(
"ShadowObfuscate HARD X v2 loaded"
);

</script>


</body>
</html>
