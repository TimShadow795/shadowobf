<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowObfuscate — HARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; min-height: 100vh; }
        .bg-lines {
            position: fixed; inset: 0;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(255,255,255,0.015) 80px, rgba(255,255,255,0.015) 81px);
            pointer-events: none; z-index: 0;
        }
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; background: rgba(5,5,5,0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .nav-inner {
            display: flex; gap: 6px; background: rgba(255,255,255,0.03);
            padding: 6px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.06);
        }
        .nav-item {
            padding: 8px 18px; border-radius: 100px; color: #a1a1aa;
            text-decoration: none; font-size: 14px; font-weight: 500;
        }
        .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; }
        .hero { padding: 110px 20px 30px; text-align: center; position: relative; z-index: 1; }
        h1 {
            font-size: clamp(2.8rem, 8vw, 4.5rem); font-weight: 800;
            color: #e4e4e7; letter-spacing: -2px; margin-bottom: 10px;
        }
        .subtitle { color: #71717a; font-size: 1.05rem; margin-bottom: 24px; }
        .obfuscator {
            max-width: 1000px; margin: 0 auto 80px; padding: 0 20px; position: relative; z-index: 1;
        }
        .obf-box {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 20px; overflow: hidden;
        }
        .obf-header {
            padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex; justify-content: space-between; align-items: center;
        }
        .obf-title { font-weight: 600; font-size: 15px; }
        .obf-badge {
            font-size: 12px; padding: 4px 10px; background: rgba(255,255,255,0.06);
            border-radius: 100px; color: #a1a1aa;
        }
        .obf-body { display: grid; grid-template-columns: 1fr 1fr; }
        @media (max-width: 800px) { .obf-body { grid-template-columns: 1fr; } }
        .code-side { padding: 20px; }
        .code-side:first-child { border-right: 1px solid rgba(255,255,255,0.06); }
        @media (max-width: 800px) {
            .code-side:first-child { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06); }
        }
        .code-label {
            font-size: 12px; color: #71717a; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500;
        }
        textarea {
            width: 100%; height: 340px; background: transparent; border: none;
            color: #d4d4d8; font-family: Consolas, monospace; font-size: 12px;
            line-height: 1.5; resize: none; outline: none;
        }
        .output-code {
            height: 340px; color: #a1a1aa; font-family: Consolas, monospace;
            font-size: 12px; line-height: 1.5; overflow-y: auto;
            white-space: pre-wrap; word-break: break-all;
        }
        .obf-footer {
            padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }
        .options { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #a1a1aa; }
        .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .obf-btn {
            padding: 10px 28px; background: #fff; color: #000; border: none;
            border-radius: 100px; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        footer { text-align: center; padding: 30px 20px; color: #52525b; font-size: 13px; }
    </style>
</head>
<body>
    <div class="bg-lines"></div>

    <nav>
        <div class="nav-inner">
            <a href="#" class="nav-item active">Home</a>
            <a href="#obfuscator" class="nav-item">Obfuscator</a>
        </div>
    </nav>

    <section class="hero">
        <h1>ShadowObfuscate</h1>
        <p class="subtitle">HARD mode • Free • Roblox</p>
    </section>

    <section class="obfuscator" id="obfuscator">
        <div class="obf-box">
            <div class="obf-header">
                <div class="obf-title">ShadowObfuscate HARD</div>
                <div class="obf-badge">Free</div>
            </div>
            <div class="obf-body">
                <div class="code-side">
                    <div class="code-label">Input</div>
                    <textarea id="input">print("Hello, World!")</textarea>
                </div>
                <div class="code-side">
                    <div class="code-label">Output (HARD)</div>
                    <div class="output-code" id="output">-- Нажми Obfuscate</div>
                </div>
            </div>
            <div class="obf-footer">
                <div class="options">
                    <label><input type="checkbox" id="optJunk" checked> Heavy Junk</label>
                    <label><input type="checkbox" id="optAnti" checked> Anti-Tamper</label>
                    <label><input type="checkbox" id="optBig" checked> Max Size</label>
                </div>
                <button class="obf-btn" onclick="runHard()">Obfuscate HARD</button>
            </div>
        </div>
    </section>

    <footer>ShadowObfuscate • HARD mode • Free Forever</footer>

<script>
function randName(len = 8) {
    const chars = 'Il1O0o';
    let s = '_';
    for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s + Math.floor(Math.random() * 9999);
}

function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateJunkBlock() {
    const a = randName(6);
    const b = randName(6);
    const c = randName(5);
    return `
local ${a} = ${randInt(1000,9999)}
local ${b} = function(...)
    local ${c} = {...}
    if ${a} > ${randInt(10000,50000)} then
        return ${c}[1]
    end
    return nil
end
${b}(${randInt(1,100)}, ${randInt(1,100)}, ${randInt(1,100)})
`;
}

function multiEncrypt(str, keys) {
    let data = [];
    for (let i = 0; i < str.length; i++) {
        let c = str.charCodeAt(i);
        for (const k of keys) {
            c = c ^ k;
            c = (c + k) & 0xFF;
        }
        data.push(c);
    }
    return data.map(b => (b < 16 ? '0' : '') + b.toString(16)).join('');
}

function runHard() {
    const src = document.getElementById('input').value;
    const out = document.getElementById('output');
    const useJunk = document.getElementById('optJunk').checked;
    const useAnti = document.getElementById('optAnti').checked;
    const maxSize = document.getElementById('optBig').checked;

    if (!src.trim()) {
        out.textContent = '-- Вставь код';
        return;
    }

    const buildId = randInt(100000, 999999);
    const keys = [randInt(20, 90), randInt(30, 120), randInt(15, 80)];

    const encrypted = multiEncrypt(src, keys);

    const chunkSize = maxSize ? 48 : 96;
    const chunks = [];
    for (let i = 0; i < encrypted.length; i += chunkSize) {
        chunks.push(encrypted.substr(i, chunkSize));
    }

    const varPayload = randName(7);
    const varKeys = randName(6);
    const varDec = randName(8);
    const varLoad = randName(7);
    const varState = randName(5);
    const varBuf = randName(6);

    let junkTop = '';
    let junkMid = '';
    if (useJunk) {
        for (let i = 0; i < (maxSize ? 18 : 8); i++) junkTop += generateJunkBlock();
        for (let i = 0; i < (maxSize ? 12 : 5); i++) junkMid += generateJunkBlock();
    }

    let anti = '';
    if (useAnti) {
        const antiName = randName(5);
        anti = `
local ${antiName} = function()
    if type(string.char) ~= "function" then return false end
    if type(bit32) ~= "table" then return false end
    if type(table.concat) ~= "function" then return false end
    return true
end
if not ${antiName}() then
    while true do end
end
`;
    }

    let payloadTable = `local ${varPayload} = {\n`;
    chunks.forEach((ch, i) => {
        payloadTable += `    [${i+1}] = "${ch}",\n`;
    });
    payloadTable += `}\n`;

    // ВАЖНО: bit32.band вместо &
    const result = `-- ShadowObfuscate HARD | Build ${buildId}

return (function()
${junkTop}
${anti}
    local ${varKeys} = {${keys.join(',')}}
    ${payloadTable}

    local function ${varDec}(hex)
        local ${varBuf} = {}
        for i = 1, #hex, 2 do
            local b = tonumber(hex:sub(i, i + 1), 16) or 0
            for j = #${varKeys}, 1, -1 do
                local k = ${varKeys}[j]
                b = bit32.band(b - k, 255)
                b = bit32.bxor(b, k)
            end
            ${varBuf}[#${varBuf} + 1] = string.char(b)
        end
        return table.concat(${varBuf})
    end

${junkMid}

    local ${varState} = 1
    local ${varLoad}
    while ${varState} do
        if ${varState} == 1 then
            local parts = {}
            for i = 1, #${varPayload} do
                parts[i] = ${varDec}(${varPayload}[i])
            end
            ${varLoad} = table.concat(parts)
            ${varState} = 2
        elseif ${varState} == 2 then
            local fn, err = loadstring(${varLoad})
            if not fn then
                return
            end
            ${varState} = 3
            return fn()
        else
            break
        end
    end
end)()`;

    out.textContent = result;
}
</script>
</body>
</html>
