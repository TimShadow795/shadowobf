<script>
    // ShadowObfuscate HARD X Engine


function randName(){

let chars =
"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

let s="_";

for(let i=0;i<12;i++){

s+=chars[
Math.floor(Math.random()*chars.length)
];

}

return s;

}



function randNum(){

return Math.floor(
Math.random()*999999
);

}




function stringEncode(str){

let arr=[];

for(let i=0;i<str.length;i++){

arr.push(
str.charCodeAt(i)^57
);

}


return `(function()
local a={${arr.join(",")}}
local s=""
for i,v in ipairs(a) do
s=s..string.char(bit32.bxor(v,57))
end
return s
end)()`;

}





function generateJunk(amount){


let out="";


for(let i=0;i<amount;i++){


let a=randName();
let b=randName();


out+=`

local ${a} = ${randNum()}

local ${b} = function()

local x = ${randNum()}

return x

end


`;

}


return out;

}





function encryptStrings(code){


return code.replace(

/"([^"]*)"/g,

function(_,x){

return stringEncode(x);

}

);


}




function renameLocals(code){


let found=[];


let regex =
/local\s+([A-Za-z_][A-Za-z0-9_]*)/g;


let m;


while(
(m=regex.exec(code))
){

found.push(m[1]);

}



for(let old of found){


let fresh =
randName();


code =
code.replace(

new RegExp(
"\\b"+old+"\\b",
"g"
),

fresh

);


}


return code;

}







function hideConstants(code){


return code.replace(

/(?<![A-Za-z_])\d+(?![A-Za-z_])/g,


function(n){


let x =
Math.floor(
Math.random()*100
);



return "("+
n+
"+"+
x+
"-"+
x+
")";


}

);


}







function runObfuscate(){


let code =
document
.getElementById("input")
.value;



if(code.trim()==""){

alert("Paste Lua code");

return;

}




// remove comments

code =
code.replace(
/--.*$/gm,
""
);




// rename

if(
document
.getElementById("rename")
.checked
){

code =
renameLocals(code);

}




// strings

if(
document
.getElementById("strings")
.checked
){

code =
encryptStrings(code);

}




// preset

let preset =
document
.getElementById("preset")
.value;



let junkCount=100;


if(preset=="Strong")
junkCount=400;


if(preset=="MAX")
junkCount=1000;






if(
document
.getElementById("junk")
.checked
){

code =
generateJunk(junkCount)
+
"\n\n"+
code;

}




let build =
Math.floor(
Math.random()*900000+
100000
);



let output =

`-- ShadowObfuscate HARD X
-- Build: ${build}
-- Preset: ${preset}
-- Generated locally


return(function(...)

${code}


end)(...)
`;



document
.getElementById("output")
.value =
output;



document
.getElementById("status")
.innerHTML =
"Protected | "+build;



}







function downloadLua(){


let text =
document
.getElementById("output")
.value;



let blob =
new Blob(
[text],
{
type:"text/plain"
}
);



let a =
document.createElement("a");



a.href =
URL.createObjectURL(blob);



a.download =
"ShadowProtected.lua";


a.click();


}
