<script>


function randomName(){

    let chars =
    "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let result = "_";

    for(let i = 0; i < 10; i++){

        result += chars[
            Math.floor(Math.random()*chars.length)
        ];

    }

    return result;

}



function randomNumber(){

    return Math.floor(
        Math.random()*90000+10000
    );

}




function encryptString(str){

    let bytes=[];


    for(let i=0;i<str.length;i++){

        bytes.push(
            str.charCodeAt(i)^133
        );

    }


    return `(function()
local _d={${bytes.join(",")}}
local _s=""
for _i,_v in ipairs(_d) do
_s=_s..string.char(bit32.bxor(_v,133))
end
return _s
end)()`;

}





function createJunk(amount){


    let out="";


    for(let i=0;i<amount;i++){


        let name=randomName();


        out +=
`
local ${name} = ${randomNumber()}

local ${randomName()} = function()

    local ${randomName()} = ${randomNumber()}

    return ${randomNumber()}

end

`;


    }


    return out;

}




function hideNumbers(code){


    return code.replace(
        /\b[0-9]+\b/g,

        function(num){


            let a =
            Math.floor(
                Math.random()*500
            );


            return `(${num}+${a}-${a})`;


        }

    );


}





function renameVariables(code){


    let variables=[];


    let regex =
    /local\s+([A-Za-z_][A-Za-z0-9_]*)/g;


    let match;


    while(
        (match=regex.exec(code))
        !==null
    ){

        variables.push(match[1]);

    }



    variables.forEach(old=>{


        let fresh =
        randomName();


        let safe =
        new RegExp(
            "\\b"+old+"\\b",
            "g"
        );


        code =
        code.replace(
            safe,
            fresh
        );


    });


    return code;


}







function protectLua(){


    let code =
    document.getElementById("input").value;



    if(!code.trim()){

        alert("Empty script");

        return;

    }



    // удаляем комментарии

    code =
    code.replace(
        /--.*$/gm,
        ""
    );




    // rename

    if(
    document.getElementById("rename")
    .checked
    ){

        code =
        renameVariables(code);

    }





    // strings

    if(
    document.getElementById("strings")
    .checked
    ){

        code =
        code.replace(
        /"([^"]*)"/g,

        function(_,text){

            return encryptString(text);

        });

    }





    // numbers

    code =
    hideNumbers(code);





    // HARD junk

    if(
    document.getElementById("junk")
    .checked
    ){


        code =
        createJunk(250)
        +
        "\n"
        +
        code;


    }





    let build =
    Math.floor(
        Math.random()*900000+
        100000
    );



    document.getElementById("output")
    .value =

`-- ShadowObfuscate HARD
-- Build ${build}
-- Protected

`+
code;



    document.getElementById("status")
    .innerHTML =
    "Protected BUILD "+build;


}






function obfuscate(){

    protectLua();

}





function copyCode(){


    navigator.clipboard.writeText(

        document
        .getElementById("output")
        .value

    );


}





function downloadLua(){


    let text =
    document
    .getElementById("output")
    .value;



    let blob =
    new Blob(
        [text],
        {
            type:"text/plain"
        }
    );



    let a =
    document.createElement("a");


    a.href =
    URL.createObjectURL(blob);



    a.download =
    "ShadowProtected.lua";


    a.click();


}





</script>
