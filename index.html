<body>

<script>
    // ===============================
// ShadowObfuscate HARD X v4 ENGINE
// ===============================


function randomName(){

    const chars =
    "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let out="_";

    for(let i=0;i<12;i++){

        out += chars[
            Math.floor(Math.random()*chars.length)
        ];

    }

    return out;

}




function randomBuild(){

    return Math.floor(
        Math.random()*900000+100000
    );

}




// 1. COMMENT CLEANER

function removeComments(code){

    code = code.replace(
        /--(?!\[\[).*$/gm,
        ""
    );


    return code;

}





// 2. SAFE STRING ENCODER

function encodeString(value){

    let nums=[];


    for(let i=0;i<value.length;i++){

        nums.push(
            value.charCodeAt(i)
        );

    }



    return `(function()
local t={${nums.join(",")}}
local s=""
for i=1,#t do
s=s..string.char(t[i])
end
return s
end)()`;

}





function protectStrings(code){


    return code.replace(

        /(["'])(?:(?=(\\?))\2.)*?\1/g,

        function(match){

            let text =
            match.substring(
                1,
                match.length-1
            );


            // не трогаем большие строки

            if(text.length>100){

                return match;

            }


            return encodeString(text);

        }

    );


}





// 3. LOCAL RENAMER

function renameLocals(code){


    let names={};


    let regex =
    /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)/g;



    let m;


    while(
        (m=regex.exec(code))
    ){

        if(!names[m[1]]){

            names[m[1]]=randomName();

        }

    }




    for(let old in names){


        let n=names[old];


        // только отдельные слова

        let r =
        new RegExp(
            "(?<!\\.)\\b"+
            old+
            "\\b",
            "g"
        );


        code =
        code.replace(r,n);


    }


    return code;

}





// 4. CONSTANT PROTECTION


function protectNumbers(code){


    return code.replace(

        /\b\d+\b/g,

        function(num){


            let a =
            Math.floor(
                Math.random()*20
            );


            return "("+
            num+
            "+"+
            a+
            "-"+
            a+
            ")";


        }

    );


}





// 5. SAFE DEAD CODE


function deadCode(level){


    let amount=0;


    if(level=="Medium")
        amount=5;


    if(level=="Strong")
        amount=15;


    if(level=="MAX")
        amount=30;




    let out="";



    for(let i=0;i<amount;i++){


        out +=
`
do
local ${randomName()} = ${i}
end
`;

    }


    return out;

}





// 6. BUILD HEADER


function createHeader(mode){


    return `

-- ShadowObfuscate HARD X v4

-- Mode: ${mode}

-- Build: ${randomBuild()}


`;

}





// 7. SAFE PACK


function packCode(code){


    return code
    .replace(/\n\s*\n+/g,"\n")
    .trim();


}





// 8. INTEGRITY INFO


function integrity(code){


    let hash=0;


    for(let i=0;i<code.length;i++){

        hash =
        ((hash<<5)-hash)
        +
        code.charCodeAt(i);

        hash|=0;

    }


    return Math.abs(hash);

}





// 9. PROTECTION LAYER


function protectionLayer(mode){


    let count=10;


    if(mode=="Strong")
        count=25;


    if(mode=="MAX")
        count=50;



    let out="";



    for(let i=0;i<count;i++){

        out +=
`local ${randomName()}=${Math.floor(Math.random()*9999)}
`;

    }



    return out;

}





// 10. MAIN ENGINE


function runObfuscate(){


    let code =
    document
    .getElementById("input")
    .value;



    if(!code.trim()){

        alert(
        "Insert Lua code"
        );

        return;

    }



    let mode =
    document
    .getElementById("preset")
    .value;




    code =
    removeComments(code);





    if(
    document
    .getElementById("rename")
    .checked
    ){

        code =
        renameLocals(code);

    }





    if(
    document
    .getElementById("strings")
    .checked
    ){

        code =
        protectStrings(code);

    }





    if(
    document
    .getElementById("numbers")
    .checked
    ){

        code =
        protectNumbers(code);

    }





    if(
    document
    .getElementById("junk")
    .checked
    ){

        code =
        protectionLayer(mode)
        +
        deadCode(mode)
        +
        code;

    }





    code =
    packCode(code);




    let hash =
    integrity(code);




    let result =

    createHeader(mode)
    +
    "-- Hash: "
    +
    hash
    +
    "\n\n"
    +
    code;




    document
    .getElementById("output")
    .value=result;



    document
    .getElementById("status")
    .innerHTML =
    "Protected ✓ | "
    +
    mode
    +
    " | Hash "
    +
    hash;


}
    // ===============================
// ShadowObfuscate HARD X v4 FINAL
// ===============================



function copyOutput(){

    let box =
    document
    .getElementById("output");


    if(!box.value){

        alert(
        "Nothing to copy"
        );

        return;

    }



    navigator.clipboard
    .writeText(box.value)
    .then(()=>{


        document
        .getElementById("status")
        .innerHTML =
        "Copied ✓";


    })
    .catch(()=>{


        box.select();

        document.execCommand(
            "copy"
        );


        document
        .getElementById("status")
        .innerHTML =
        "Copied ✓";


    });


}






function downloadLua(){


    let text =
    document
    .getElementById("output")
    .value;



    if(!text){


        alert(
        "Nothing to download"
        );


        return;

    }




    let file =
    new Blob(
        [text],
        {
            type:"text/plain"
        }
    );




    let url =
    URL.createObjectURL(file);




    let a =
    document.createElement("a");



    a.href=url;


    a.download =
    "ShadowProtected.lua";



    document
    .body
    .appendChild(a);



    a.click();



    document
    .body
    .removeChild(a);



    URL
    .revokeObjectURL(url);



    document
    .getElementById("status")
    .innerHTML =
    "Downloaded ✓";


}





console.log(
"ShadowObfuscate HARD X v4 loaded"
);


</script>
