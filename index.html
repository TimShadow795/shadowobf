<body>


<div class="app">


<div class="header">

<div class="logo">
ShadowObfuscate <span>HARD X</span>
</div>


<div class="build">
BUILD 832814
</div>

</div>



<div class="container">



<div class="panel">


<h3>Protection Engine</h3>


<div class="option">
String Encrypt
<input id="enc" type="checkbox" checked>
</div>


<div class="option">
Rename
<input id="rename" type="checkbox" checked>
</div>


<div class="option">
Constants
<input id="const" type="checkbox" checked>
</div>


<div class="option">
Junk
<input id="junk" type="checkbox" checked>
</div>



<button onclick="protect()">
OBFUSCATE
</button>


<button onclick="copyCode()">
COPY
</button>


<button onclick="downloadLua()">
DOWNLOAD
</button>

READY
</p>


</div>



<div class="panel">


<h3>INPUT LUA</h3>

<textarea id="input"
placeholder="Paste Luau code here..."></textarea>


<h3>OUTPUT</h3>

<textarea id="output"
readonly></textarea>



</div>



</div>


</div>

<script>


function randomName(){

let chars=
"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

let out="_";

for(let i=0;i<12;i++){

out+=chars[
Math.floor(Math.random()*chars.length)
];

}

return out;

}




function encryptString(text){

let arr=[];


for(let i=0;i<text.length;i++){

arr.push(
text.charCodeAt(i)^91
);

}


return `(function()
local d={${arr.join(",")}}
local s=""
for i,v in ipairs(d) do
s=s..string.char(bit32.bxor(v,91))
end
return s
end)()`;

}





function renameVariables(code){


let vars =
code.match(
/local\s+[a-zA-Z_][a-zA-Z0-9_]*/g
);



if(!vars)
return code;



vars.forEach(v=>{


let old=
v.replace("local ","");


let n=
randomName();



code =
code.split(old)
.join(n);



});


return code;

}





function hideNumbers(code){

return code.replace(

/\b[0-9]+\b/g,

function(n){

let x=
Math.floor(Math.random()*50)+1;


return `(${n}+${x}-${x})`;

}

);

}





function junkCode(){

let out="";


for(let i=0;i<25;i++){


out+=`

local ${randomName()} =
function()

local ${randomName()} =
${Math.floor(Math.random()*99999)}

return ${randomName()}

end


`;

}


return out;

}





function protect(){


let code =
document.getElementById("input").value;



if(code.length===0){

alert("Insert Lua code");

return;

}





// remove comments

code =
code.replace(
/--.*/g,
""
);




// rename

if(
document.getElementById("rename").checked
){

code =
renameVariables(code);

}




// strings

if(
document.getElementById("enc").checked
){

code =
code.replace(

/"([^"]*)"/g,

function(a,b){

return encryptString(b);

}

);

}





// constants

if(
document.getElementById("const").checked
){

code =
hideNumbers(code);

}




// junk

if(
document.getElementById("junk").checked
){

code =
junkCode()
+
code;

}





let build =
Math.floor(
Math.random()*999999
);



document.getElementById("output").value =

"-- ShadowObfuscate HARD X\n"+
"-- Protected Build "+build+
"\n\n"+
code;



document.getElementById("status").innerHTML =

"PROTECTED | BUILD "+build;



}







function copyCode(){

navigator.clipboard.writeText(

document.getElementById("output").value

);


document.getElementById("status").innerHTML=
"Copied.";

}







function downloadLua(){



let data =

document.getElementById("output").value;



let blob =

new Blob(
[data],
{
type:"text/plain"
}
);



let link =
document.createElement("a");



link.href =
URL.createObjectURL(blob);



link.download =
"ShadowProtected.lua";



link.click();



document.getElementById("status").innerHTML=
"Downloaded.";

}




</script>
