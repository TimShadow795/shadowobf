<script>
// ShadowObfuscate HARD X Engine FIXED
// ShadowObfuscate HARD X Engine FIXED

function randName(){

    let chars =
    "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let s="_";

    for(let i=0;i<12;i++){

        s += chars[
            Math.floor(Math.random()*chars.length)
        ];

    }

    return s;

}




function randNum(){

    return Math.floor(
        Math.random()*900000+10000
    );

}




function stringEncode(str){

    let arr=[];


    for(let i=0;i<str.length;i++){

        arr.push(
            str.charCodeAt(i)^57
        );

    }


    return `(function()
local d={${arr.join(",")}}
local s=""
for i,v in ipairs(d) do
s=s..string.char(bit32.bxor(v,57))
end
return s
end)()`;

}






function generateJunk(amount){

    let out="";


    for(let i=0;i<amount;i++){

        let a=randName();
        let b=randName();
        let c=randName();


        out +=
`local ${a} = ${randNum()}

local ${b} = function()

local ${c} = ${randNum()}

return ${c}

end

`;

    }


    return out;

}







function encryptStrings(code){


    return code.replace(
        /"([^"]*)"/g,

        function(_,text){

            return stringEncode(text);

        }

    );


}







function renameLocals(code){


    let variables=[];


    let regex =
    /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)/g;


    let match;



    while(
        (match=regex.exec(code)) !== null
    ){

        variables.push(match[1]);

    }




    for(let oldName of variables){


        let newName =
        randName();



        let safe =
        new RegExp(
            "\\b"+oldName+"\\b",
            "g"
        );



        code =
        code.replace(
            safe,
            newName
        );


    }



    return code;


}







function hideConstants(code){


    return code.replace(

        /\b\d+\b/g,

        function(n){


            let x =
            Math.floor(
                Math.random()*100
            );


            return "("+
            n+
            "+"+
            x+
            "-"+
            x+
            ")";


        }

    );


}







function runObfuscate(){



    let code =
    document
    .getElementById("input")
    .value;



    if(!code.trim()){

        alert(
        "Paste Lua code first"
        );

        return;

    }




    // remove comments

    code =
    code.replace(
        /--.*$/gm,
        ""
    );






    if(
    document
    .getElementById("rename")
    .checked
    ){

        code =
        renameLocals(code);

    }







    if(
    document
    .getElementById("strings")
    .checked
    ){

        code =
        encryptStrings(code);

    }







    code =
    hideConstants(code);








    let preset =
    document
    .getElementById("preset")
    .value;





    let junk=100;



    if(preset=="Strong"){

        junk=500;

    }



    if(preset=="MAX"){

        junk=1600;

    }







    if(
    document
    .getElementById("junk")
    .checked
    ){

        code =
        generateJunk(junk)
        +
        "\n\n"
        +
        code;

    }







    let build =
    Math.floor(
        Math.random()*900000+100000
    );






    let output =

`-- ShadowObfuscate HARD X
-- Build ${build}
-- Preset ${preset}

(function(...)

${code}

end)(...)`;







    document
    .getElementById("output")
    .value =
    output;





    document
    .getElementById("status")
    .innerHTML =
    "Protected | BUILD "+build;



}








function downloadLua(){


    let text =
    document
    .getElementById("output")
    .value;



    if(!text){

        alert(
        "Nothing to download"
        );

        return;

    }




    let blob =
    new Blob(
        [text],
        {
            type:"text/plain"
        }
    );



    let link =
    document.createElement("a");



    link.href =
    URL.createObjectURL(blob);



    link.download =
    "ShadowProtected.lua";



    link.click();


}
